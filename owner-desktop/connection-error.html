<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>FastFood Owner</title>
    <style>
      body {
        font-family: system-ui, 'Segoe UI', sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8f7f4;
        color: #24272c;
      }
      main {
        max-width: 560px;
        padding: 32px;
      }
      h1 {
        font-size: 24px;
        margin: 0 0 12px;
      }
      p {
        color: #5b5f64;
        line-height: 1.55;
      }
      code {
        background: #ece9e1;
        padding: 2px 6px;
        border-radius: 6px;
        word-break: break-all;
      }
      .row {
        display: flex;
        gap: 10px;
        margin-top: 20px;
        flex-wrap: wrap;
      }
      button {
        padding: 12px 18px;
        font-size: 15px;
        border-radius: 10px;
        border: 1px solid #c9c9c1;
        background: #fff;
        cursor: pointer;
      }
      button.primary {
        background: #ce431b;
        color: #fff;
        border-color: #ce431b;
      }
      #status {
        margin-top: 14px;
        font-size: 14px;
        color: #5b5f64;
        min-height: 20px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Markaziy serverga ulanib bo‘lmadi</h1>
      <p>FastFood Owner markaziy serverga ulana olmadi.</p>
      <p>
        Internet ulanishini va server yoqilganini tekshiring. Server
        ko‘chirilgan bo‘lsa, yangi manzilni «Server manzili» orqali kiriting.
        Dastur o‘zi har 10 soniyada qayta urinadi.
      </p>
      <div class="row">
        <button class="primary" id="retry">Qayta urinish</button>
        <button id="settings">Server manzili…</button>
      </div>
      <div id="status"></div>
      <details style="margin-top: 18px; font-size: 12px; color: #747775">
        <summary>Texnik ma’lumot</summary>
        <p>Manzil: <code id="url">—</code></p>
        <p id="detail"></p>
      </details>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      const query = new URLSearchParams(location.search);
      $('url').textContent = query.get('url') || '—';
      $('detail').textContent = query.get('reason') || '';
      let busy = false;
      async function retry(manual) {
        if (busy) return;
        busy = true;
        $('status').textContent = 'Tekshirilmoqda…';
        const result = await ownerConn.retry();
        busy = false;
        if (!result.ok)
          $('status').textContent =
            'Hali ulanmadi (' + new Date().toLocaleTimeString('uz-UZ') + ').';
      }
      $('retry').onclick = () => retry(true);
      $('settings').onclick = () => ownerConn.settings();
      setInterval(() => retry(false), 10000);
    </script>
  </body>
</html>
