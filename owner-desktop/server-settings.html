<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Server manzili</title>
    <style>
      body {
        font-family: system-ui, 'Segoe UI', sans-serif;
        margin: 0;
        padding: 24px;
        background: #f8f7f4;
        color: #24272c;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        color: #5b5f64;
        font-size: 14px;
        line-height: 1.5;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        font-size: 16px;
        border: 1px solid #c9c9c1;
        border-radius: 10px;
      }
      .row {
        display: flex;
        gap: 10px;
        margin-top: 14px;
        flex-wrap: wrap;
      }
      button {
        padding: 12px 18px;
        font-size: 15px;
        border-radius: 10px;
        border: 1px solid #c9c9c1;
        background: #fff;
        cursor: pointer;
      }
      button.primary {
        background: #ce431b;
        color: #fff;
        border-color: #ce431b;
      }
      #message {
        margin-top: 12px;
        font-size: 14px;
        min-height: 20px;
      }
      .error {
        color: #b3261e;
      }
      .ok {
        color: #237755;
      }
    </style>
  </head>
  <body>
    <h1>Markaziy server manzili</h1>
    <p>
      Server boshqa joyga ko‘chirilganda yangi manzilni shu yerga kiriting
      (dasturni qayta yig‘ish shart emas). Faqat <b>https://</b> manzillar qabul
      qilinadi. Qurilma kaliti va tasdiqlangan qurilma saqlanadi.
    </p>
    <p>Hozirgi manzil: <b id="current">…</b></p>
    <input id="url" placeholder="https://server.misol.uz" autocomplete="off" />
    <div class="row">
      <button class="primary" id="save">Tekshirish va saqlash</button>
      <button id="reset">Dastur bilan kelgan manzilga qaytish</button>
    </div>
    <div id="message"></div>
    <script>
      const $ = (id) => document.getElementById(id);
      const say = (text, ok) => {
        $('message').textContent = text;
        $('message').className = ok ? 'ok' : 'error';
      };
      ownerServer.get().then((info) => {
        $('current').textContent = info.url || '—';
        $('url').value = info.custom ? info.url : '';
      });
      $('save').onclick = async () => {
        say('Tekshirilmoqda…', true);
        const result = await ownerServer.save($('url').value);
        if (result.ok) say('Saqlandi. Dastur qayta ishga tushadi…', true);
        else say(result.error, false);
      };
      $('reset').onclick = async () => {
        await ownerServer.reset();
        say('Dastur qayta ishga tushadi…', true);
      };
    </script>
  </body>
</html>
